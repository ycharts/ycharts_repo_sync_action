name: 'Pull Request another repository'
description: 'Used for pull request a copy of a folder to another repository'
inputs:
  source_folder:
    description: 'Source folder from origin'
    required: true
  source_files:
    description: 'Source files from origin'
    required: true
  destination_repo:
    description: 'Destination repository'
    required: true
  destination_folder:
    description: 'Destination folder to push the origin folder'
    required: false
  user_email:
    description: 'Email for the git commit'
    required: true
  user_name:
    description: 'GitHub username for the commit'
    required: true
  destination_head_branch:
    description: 'The branch to create to push the changes. Cannot be master or main'
    required: true
  timestamp_head_branch:
    description: 'Whether or not to append a timestamp to the branch name'
    required: false
    default: false
  destination_base_branch:
    description: 'The branch into which you want your code merged.'
    required: false
    default: "main"
  pull_request_reviewers:
    description: 'Pull request reviewers users'
    required: false
  pull_request_labels:
    description: 'Comma-separated labels to add to the pull request. Labels missing from the destination repository are skipped with a warning'
    required: false
  close_existing_pull_requests:
    description: 'Whether to close open pull requests in the destination repository whose title contains destination_head_branch before creating the new one'
    required: false
    default: true
  source_commit:
    description: 'Commit SHA, e.g. github.sha. When set, only files the commit added or modified (compared to its first parent) are copied, still filtered by source_folder and source_files'
    required: false
  generate_pr_description:
    description: 'Whether to generate the pull request title and description with the Claude API. Requires the ANTHROPIC_API_KEY env var. Falls back to the default title and body on any failure'
    required: false
    default: false
  anthropic_model:
    description: 'Claude model used to generate the pull request description'
    required: false
    default: "claude-opus-5-5"
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.source-folder }}
    - ${{ inputs.source-files }}
    - ${{ inputs.destination-repo }}
    - ${{ inputs.destination-folder }}
    - ${{ inputs.user-email }}
    - ${{ inputs.user-name }}
    - ${{ inputs.destination-head-branch }}
    - ${{ inputs.timestamp-head-branch }}
    - ${{ inputs.destination-base-branch }}
    - ${{ inputs.pull-request-reviewers }}
branding:
  icon: 'git-commit'
  color: 'green'
